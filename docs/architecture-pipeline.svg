<svg width="680" height="856" viewBox="0 0 680 856" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Clinical note summarisation pipeline</title>
<desc>Encounter notes flow through ingest, section extraction, citation-bound draft generation, verification, coverage checking, and clinician review, all inside a boundary with no data egress. A signed summary exits only after clinician sign-off.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
text { font-family: 'IBM Plex Sans', Arial, sans-serif; }
.t { font-size:14px; }
.ts { font-size:12px; }
.th { font-size:14px; font-weight:500; }
</style>

<rect x="40" y="50" width="600" height="700" rx="20" fill="none" stroke="#8A8A85" stroke-width="1" stroke-dasharray="6 5"/>
<text class="th" x="60" y="76" fill="#2C2C2A">Customer environment</text>
<text class="ts" x="60" y="94" fill="#5F5E5A">PHI never leaves this boundary</text>

<g>
<rect x="170" y="110" width="340" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="340" y="133" text-anchor="middle" fill="#444441">Encounter notes</text>
<text class="ts" x="340" y="151" text-anchor="middle" fill="#5F5E5A">Line-numbered, timestamped</text>
</g>
<line x1="340" y1="166" x2="340" y2="200" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<g>
<rect x="170" y="200" width="340" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="340" y="223" text-anchor="middle" fill="#444441">Ingest &amp; normalize</text>
<text class="ts" x="340" y="241" text-anchor="middle" fill="#5F5E5A">Parses into source segments</text>
</g>
<line x1="340" y1="256" x2="340" y2="290" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<g>
<rect x="170" y="290" width="340" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="340" y="313" text-anchor="middle" fill="#444441">Section extraction</text>
<text class="ts" x="340" y="331" text-anchor="middle" fill="#5F5E5A">Tags candidate spans</text>
</g>
<line x1="340" y1="346" x2="340" y2="380" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<g>
<rect x="170" y="380" width="340" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="340" y="403" text-anchor="middle" fill="#0C447C">Draft generation</text>
<text class="ts" x="340" y="421" text-anchor="middle" fill="#185FA5">Sentence + citation pairs</text>
</g>
<line x1="340" y1="436" x2="340" y2="470" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<g>
<rect x="170" y="470" width="340" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="340" y="493" text-anchor="middle" fill="#085041">Verification pass</text>
<text class="ts" x="340" y="511" text-anchor="middle" fill="#0F6E56">Checks citation entailment</text>
</g>
<line x1="340" y1="526" x2="340" y2="560" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<g>
<rect x="170" y="560" width="340" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="th" x="340" y="583" text-anchor="middle" fill="#633806">Coverage check</text>
<text class="ts" x="340" y="601" text-anchor="middle" fill="#854F0B">Flags missing required fields</text>
</g>
<line x1="340" y1="616" x2="340" y2="650" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<g>
<rect x="170" y="650" width="340" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="340" y="673" text-anchor="middle" fill="#3C3489">Clinician review</text>
<text class="ts" x="340" y="691" text-anchor="middle" fill="#534AB7">Edits &amp; signs — never auto-sent</text>
</g>

<line x1="340" y1="706" x2="340" y2="770" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<g>
<rect x="210" y="770" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="340" y="793" text-anchor="middle" fill="#444441">Signed summary</text>
<text class="ts" x="340" y="811" text-anchor="middle" fill="#5F5E5A">Enters chart via clinician</text>
</g>
</svg>
