<svg width="680" height="420" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>End to end dev to production architecture</title>
<desc>Dev, staging, and production environments in sequence, all inside a customer environment boundary. Staging is gated by an eval corpus built from de-identified historical notes. Production hands off to the runtime pipeline covering the data and control planes.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
text { font-family: 'IBM Plex Sans', Arial, sans-serif; }
.t { font-size:14px; }
.ts { font-size:12px; }
.th { font-size:14px; font-weight:500; }
</style>

<rect x="30" y="40" width="620" height="340" rx="20" fill="none" stroke="#8A8A85" stroke-width="1" stroke-dasharray="6 5"/>
<text class="th" x="50" y="64" fill="#2C2C2A">Customer environment</text>
<text class="ts" x="50" y="82" fill="#5F5E5A">Dev, staging &amp; production all in-boundary</text>

<g>
<rect x="60" y="100" width="170" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="145" y="126" text-anchor="middle" fill="#0C447C">Dev</text>
<text class="ts" x="145" y="144" text-anchor="middle" fill="#185FA5">Synthetic only</text>
</g>
<line x1="230" y1="130" x2="250" y2="130" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<g>
<rect x="250" y="100" width="170" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="335" y="126" text-anchor="middle" fill="#0C447C">Staging</text>
<text class="ts" x="335" y="144" text-anchor="middle" fill="#185FA5">Eval gate blocks</text>
</g>
<line x1="420" y1="130" x2="440" y2="130" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<g>
<rect x="440" y="100" width="170" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="525" y="126" text-anchor="middle" fill="#0C447C">Production</text>
<text class="ts" x="525" y="144" text-anchor="middle" fill="#185FA5">Canary by ward</text>
</g>

<line x1="335" y1="210" x2="335" y2="160" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<g>
<rect x="250" y="210" width="170" height="70" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="th" x="335" y="238" text-anchor="middle" fill="#633806">Eval corpus</text>
<text class="ts" x="335" y="256" text-anchor="middle" fill="#854F0B">De-identified</text>
</g>

<line x1="525" y1="160" x2="525" y2="210" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<g>
<rect x="440" y="210" width="170" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="525" y="238" text-anchor="middle" fill="#085041">Runtime</text>
<text class="ts" x="525" y="256" text-anchor="middle" fill="#0F6E56">Data + control planes</text>
</g>
</svg>
