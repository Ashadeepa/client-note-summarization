<svg width="680" height="540" viewBox="0 0 680 540" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Data plane and control plane</title>
<desc>A customer environment boundary containing two parallel columns: a data plane (ingest and extract, generate and verify, clinician review) and a control plane (policy and schema, model versioning, audit and kill switch) that governs each data plane stage via dashed connectors. A signed summary exits the boundary only after clinician review.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
text { font-family: 'IBM Plex Sans', Arial, sans-serif; }
.t { font-size:14px; }
.ts { font-size:12px; }
.th { font-size:14px; font-weight:500; }
</style>

<rect x="30" y="40" width="620" height="380" rx="20" fill="none" stroke="#8A8A85" stroke-width="1" stroke-dasharray="6 5"/>
<text class="th" x="50" y="64" fill="#2C2C2A">Customer environment</text>
<text class="ts" x="50" y="82" fill="#5F5E5A">No PHI leaves this boundary</text>

<rect x="50" y="95" width="280" height="300" rx="16" fill="none" stroke="#D3D1C7" stroke-width="0.5"/>
<text class="th" x="70" y="118" fill="#2C2C2A">Data plane</text>
<text class="ts" x="70" y="134" fill="#5F5E5A">Notes flow through here</text>

<rect x="350" y="95" width="280" height="300" rx="16" fill="none" stroke="#D3D1C7" stroke-width="0.5"/>
<text class="th" x="370" y="118" fill="#2C2C2A">Control plane</text>
<text class="ts" x="370" y="134" fill="#5F5E5A">Governs every step</text>

<g>
<rect x="70" y="150" width="240" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="190" y="176" text-anchor="middle" fill="#085041">Ingest &amp; extract</text>
<text class="ts" x="190" y="194" text-anchor="middle" fill="#0F6E56">Line-numbered, tagged</text>
</g>
<line x1="190" y1="210" x2="190" y2="230" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<g>
<rect x="70" y="230" width="240" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="190" y="256" text-anchor="middle" fill="#085041">Generate &amp; verify</text>
<text class="ts" x="190" y="274" text-anchor="middle" fill="#0F6E56">Citation-bound draft</text>
</g>
<line x1="190" y1="290" x2="190" y2="310" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<g>
<rect x="70" y="310" width="240" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="190" y="336" text-anchor="middle" fill="#085041">Clinician review</text>
<text class="ts" x="190" y="354" text-anchor="middle" fill="#0F6E56">Human edits &amp; signs</text>
</g>

<g>
<rect x="370" y="150" width="240" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="490" y="176" text-anchor="middle" fill="#3C3489">Policy &amp; schema</text>
<text class="ts" x="490" y="194" text-anchor="middle" fill="#534AB7">Fields &amp; thresholds</text>
</g>
<line x1="490" y1="210" x2="490" y2="230" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<g>
<rect x="370" y="230" width="240" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="490" y="256" text-anchor="middle" fill="#3C3489">Model versioning</text>
<text class="ts" x="490" y="274" text-anchor="middle" fill="#534AB7">Pinned model versions</text>
</g>
<line x1="490" y1="290" x2="490" y2="310" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<g>
<rect x="370" y="310" width="240" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="490" y="336" text-anchor="middle" fill="#3C3489">Audit &amp; kill-switch</text>
<text class="ts" x="490" y="354" text-anchor="middle" fill="#534AB7">Full trace, auto-halt</text>
</g>

<line x1="370" y1="180" x2="310" y2="180" stroke="#8A8A85" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<line x1="370" y1="260" x2="310" y2="260" stroke="#8A8A85" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<line x1="370" y1="340" x2="310" y2="340" stroke="#8A8A85" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

<line x1="190" y1="370" x2="190" y2="440" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<g>
<rect x="90" y="440" width="200" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="190" y="466" text-anchor="middle" fill="#444441">Signed summary</text>
<text class="ts" x="190" y="484" text-anchor="middle" fill="#5F5E5A">Enters chart via clinician</text>
</g>
</svg>
