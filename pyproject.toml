[project]
name = "clinical-note-summarization"
version = "0.1.0"
description = "Vertical-slice pipeline: ingest -> section extraction -> citation-bound generation -> independent verification -> deterministic coverage gate -> open-loop detection."
requires-python = ">=3.11"
dependencies = ["anthropic>=0.69"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
gemini = ["google-genai>=1.0"]
server = ["fastapi>=0.115", "uvicorn>=0.30"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
